baseURL = "https://3dprintblimp.com/"
languageCode = "en-us"
title = "3D Print Blimp"

[outputs]
  home = ["HTML", "JSON"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# Only these params are consumed by rendered output (layouts/_default/baseof.html,
# the /articles/ list page, and layouts/index.json). The homepage is served from
# static/index.html, which Hugo copies over its own generated index.html.
[params]
siteName    = "3D Print Blimp"
description = "3D Print Blimp is a PrintWire network site about 3D printing for airships and aerostats. PrintWire passes quote requests to specialised manufacturers and returns pricing. PrintWire does not manufacture parts itself."
logoHtml    = '3D&nbsp;PRINT&nbsp;<span class="ed-logo-accent">BLIMP</span>'
ogImage     = "/images/01_hero_lattice_gondola.png"
heroImage   = "images/01_hero_lattice_gondola.png"
